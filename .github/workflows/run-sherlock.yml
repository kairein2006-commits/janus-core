name: Run Sherlock OSINT

on:
  repository_dispatch:
    types: [run-sherlock]

jobs:
  osint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sherlock
        run: |
          # Запускаем sherlock и сохраняем результаты в текстовый/json файл
          python -m sherlock "${{ github.event.client_payload.username }}" --print-found --output result.json || true

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: osint-result
          path: result.json
