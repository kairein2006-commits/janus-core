name: Run Sherlock OSINT

on:
  repository_dispatch:
    types: [run-sherlock]

jobs:
  osint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sherlock-project requests

      - name: Run Sherlock
        run: |
          # Запускаем через модуль, а результат сохраняется прямо в корень
          python -m sherlock "${{ github.event.client_payload.username }}" --print-found --output result.json || true

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Update OSINT results for ${{ github.event.client_payload.username }}"
          file_pattern: result.json
