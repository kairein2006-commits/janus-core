name: Run Sherlock OSINT

on:
  repository_dispatch:
    types: [run-sherlock]

jobs:
  osint:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Право на запись обратно в репозиторий
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sherlock
        run: |
          python -m sherlock "${{ github.event.client_payload.username }}" --print-found --output result.json || true

      - name: Commit and push results
        run: |
          git config --global user.name "Janus Bot"
          git config --global user.email "bot@janus.local"
          git add result.json
          git commit -m "Auto: Update OSINT results for ${{ github.event.client_payload.username }}" || echo "No changes to commit"
          git push
